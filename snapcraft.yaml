      - kf6-kcompletion
      - kf6-kconfig
      - kf6-kconfigwidgets
      - kf6-kcontacts
      - kf6-kcoreaddons
      - kf6-kcrash
      - kf6-kdav
      - kf6-kdbusaddons
      - kf6-kdeclarative
      - kf6-kded
