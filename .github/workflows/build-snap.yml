name: build-snap
on:
  pull_request:
  push:
    branches:
      - desktop/26
  # The runtime floats on Neon's release/resolute suite, which moves
  # independently of this repository: Qt/KF6 can roll forward without any
  # commit here. A daily rebuild keeps the published snap reasonably
  # fresh even when nobody is pushing (the dependents are rebuilt from
  # this workflow, see the dispatch step below).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    # 26.04, like every other snap producer here. The retry loop below
    # exists because this project installs build-packages inside
    # snapcraft's LXD instance, which forces an apt refresh against the
    # KDE neon archive; that archive was intermittently unreachable from
    # GitHub runners during the 2026-11-21 outage, and the failure was
    # transient rather than runner-specific (it hit 24.04 and 26.04
    # alike).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot squashfs-tools
      - name: Set up LXD (mirrors snapcore/action-build)
        run: |
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd "$USER"
          sudo snap install lxd
          sudo lxd init --auto
          # GH runners ship docker/moby, whose FORWARD DROP policy breaks
          # LXD bridge networking ("no network access" while creating the
          # build instance) - see snapcore/action-build ensureLXDNetwork.
          sudo iptables -P FORWARD ACCEPT
      - name: Build kf6-core26 snap
        run: |
          sudo snap install snapcraft --classic --channel=edge
          # Re-exec with fresh group membership so snapcraft can talk to
          # the LXD socket (see action-build's sudo -u "$USER" pattern).
          # Retry: snapcraft's LXD VM on hosted runners occasionally
          # comes up without working package-list access ("failed to run
          # apt update", a partial build-package install, or one failed
          # archive fetch), which is transient.
          ok=0
          for attempt in 1 2 3; do
            if sudo -u "$USER" ./build.sh; then ok=1; break; fi
            echo "build attempt ${attempt} failed; retrying"
            sudo -u "$USER" snapcraft clean >/dev/null 2>&1 || true
            sleep 30
          done
          [ "$ok" = 1 ]
      - name: Publish to desktop-26-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-26-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create desktop-26-latest -R "$GITHUB_REPOSITORY" \
                 --title "desktop/26 latest snap" \
                 --notes "Rolling latest desktop/26 snap build; assets are replaced on every green build."
          gh release upload desktop-26-latest kf6-core26.snap -R "$GITHUB_REPOSITORY" --clobber
      - name: Rebuild the Plasma snaps against the new runtime
        # kf6-core26 is the content snap that carries Qt/KF6; the Plasma
        # snaps stage kwin/plasma binaries that link against it. When Neon
        # rolls Qt forward, a rebuild here can leave them ABI-skewed (the
        # 2026-11-21 incident: Qt 6.12 here against a kwin built for
        # 6.11, every version manifest still green, the session
        # crash-looping at boot). Rebuilding the dependents immediately
        # keeps the published set consistent.
        #
        # A repository-scoped GITHUB_TOKEN cannot dispatch workflows into
        # another repository, so this needs a fine-grained PAT with
        # Actions: write on the two dependents (secret REBUILD_TOKEN).
        # Without it we warn instead of failing, and the daily schedule in
        # those repositories still converges the set.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.REBUILD_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::REBUILD_TOKEN not set; skipping dependent rebuilds"
            exit 0
          fi
          for repo in chris-bainbridge/plasma-core-desktop \
                      chris-bainbridge/plasma-desktop-session; do
            echo "==> dispatching build-snap on ${repo}"
            gh workflow run build-snap.yml -R "${repo}" --ref desktop/26
          done
      - uses: actions/upload-artifact@v6
        with:
          name: snap
          path: kf6-core26.snap
          compression-level: 0
          retention-days: 14
