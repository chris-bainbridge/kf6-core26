      - qt6-websockets
      - qt6-webview
      # resolute archive: X11 keymap + locale data (XKB_CONFIG_ROOT/XLOCALEDIR targets)
      - xkb-data
      - libx11-data
      # xkbcomp — Xwayland execs it at the ABSOLUTE path /usr/bin/xkbcomp
      # to compile keymaps; without it Xwayland dies with "Failed to
      # activate virtual core keyboard", kwin disables Xwayland after 4
      # crashes, and every X client (incl. ksmserver's X connect) hangs
      # on the orphaned X socket. The layout: in the session snap points
      # /usr/bin/xkbcomp at $SNAP/kf6/usr/bin/xkbcomp. x11-xkb-utils is
      # an Ubuntu package, so the Neon-Contents mapping of the old SDK
      # inventory could not see it (it sat in the unmapped-files set).
      - x11-xkb-utils
    override-pull: |
      # craft injects http_proxy into the process env, but python-apt's
      # fetch methods ignore the env and read apt.conf only -- without
      # this file the deb downloads bypass the caching proxy entirely.
      # On CI there is no http_proxy env and apt goes direct.
      if [ -n "${http_proxy:-}" ]; then
          printf 'Acquire::http::Proxy "%s";\n' "$http_proxy" \
              > /etc/apt/apt.conf.d/95proxy
      fi
      craftctl set version="$(/bin/date +%Y%m%d)-deb"
      craftctl default
    override-prime: |
      # A previous prime's dereference leaves a real directory where the
      # stage has a symlink; re-priming then fails with IsADirectoryError
      # copying the symlink over the directory. Clear the leftover first
      # so the default prime sync succeeds.
      if [ -d "$SNAPCRAFT_PRIME/usr/share/X11/xkb" ] && \
         [ ! -L "$SNAPCRAFT_PRIME/usr/share/X11/xkb" ]; then
          rm -rf "$SNAPCRAFT_PRIME/usr/share/X11/xkb"
      fi
      craftctl default
      # On resolute, xkb-data ships /usr/share/X11/xkb as a relative
      # symlink to the real xkeyboard-config-2 directory (mirroring the
      # base). The session snap points XKB_CONFIG_ROOT at
      # $SNAP/kf6/usr/share/X11/xkb, and the old build.sh dereferenced the
      # symlink when copying from the host ("cp -aL"), so the content snap
      # always carried a real directory. Keep that layout: replace the
      # primed symlink with a dereferenced copy. This must happen AFTER
      # craftctl default -- craft's prime step walks the stage layer
      # manifest and chokes (IsADirectoryError) if the deb-shipped symlink
      # is replaced by a directory at stage time. The prime tree is
      # self-contained (xkeyboard-config-2 is primed too), so resolve the
      # target within it and refuse anything that escapes.
      if [ -L "$SNAPCRAFT_PRIME/usr/share/X11/xkb" ]; then
          target="$(readlink -f "$SNAPCRAFT_PRIME/usr/share/X11/xkb")"
          case "$target" in
              "$SNAPCRAFT_PRIME"/*) ;;
              *) echo "xkb symlink target escaped the prime tree: $target" >&2; exit 1 ;;
          esac
          rm "$SNAPCRAFT_PRIME/usr/share/X11/xkb"
          cp -a "$target" "$SNAPCRAFT_PRIME/usr/share/X11/xkb"
      fi
      # libproxy.so.1 has DT_NEEDED libpxbackend-1.0.so, but that file
      # ships in a libproxy/ SUBDIRECTORY that is only reachable via
      # libproxy.so.1's absolute RUNPATH (/usr/lib/<triplet>/libproxy).
      # Inside the session snap's namespace that path is hidden by the
      # session snap's own /usr overlay, so the backend is not loadable
      # and startplasma-wayland dies with exit 127 (SDDM login loops).
      # Expose it at a top-level, searchable path: this snap's
      # usr/lib/<triplet> is on the session's LD_LIBRARY_PATH and is
      # always visible (it is the content mount the session resolves
      # libproxy.so.1 from in the first place). amd64-only branch, so the
      # triplet is fixed.
      libproxy_dir="$SNAPCRAFT_PRIME/usr/lib/x86_64-linux-gnu/libproxy"
      if [ -f "$libproxy_dir/libpxbackend-1.0.so" ] && \
         [ ! -e "$SNAPCRAFT_PRIME/usr/lib/x86_64-linux-gnu/libpxbackend-1.0.so" ]; then
          ln -s libproxy/libpxbackend-1.0.so \
             "$SNAPCRAFT_PRIME/usr/lib/x86_64-linux-gnu/libpxbackend-1.0.so"
      fi
      # Same class as libpxbackend: libpulse.so.0 has DT_NEEDED
      # libpulsecommon-17.0.so, shipped in the pulseaudio/ SUBDIRECTORY and
      # reachable only via libpulse.so.1's absolute RUNPATH
      # (/usr/lib/<triplet>/pulseaudio) -- hidden inside the session
      # namespace, and the base ships no pulseaudio stack at all. Without
      # it every pulseaudio-linked app (dolphin, ...) dies with
      # "error while loading shared libraries: libpulsecommon-17.0.so".
      pulse_dir="$SNAPCRAFT_PRIME/usr/lib/x86_64-linux-gnu/pulseaudio"
      if [ -f "$pulse_dir/libpulsecommon-17.0.so" ] && \
         [ ! -e "$SNAPCRAFT_PRIME/usr/lib/x86_64-linux-gnu/libpulsecommon-17.0.so" ]; then
          ln -s pulseaudio/libpulsecommon-17.0.so \
             "$SNAPCRAFT_PRIME/usr/lib/x86_64-linux-gnu/libpulsecommon-17.0.so"
      fi
      # Record the resolved Neon/resolute deb set (name + version) inside
      # the snap. go-build-kde compares this manifest between kf6-core26
      # and plasma-core26-desktop to catch Qt/KF6 version skew from
      # rebuilding one content snap without the other.
      mkdir -p "$SNAPCRAFT_PRIME/meta"
      : > "$SNAPCRAFT_PRIME/meta/pkg-manifest.txt"
      for deb in /root/parts/kf6-runtime/stage_packages/*.deb \
                 "$CRAFT_PART_INSTALL/../stage_packages"/*.deb; do
          [ -e "$deb" ] || continue
          dpkg-deb -f "$deb" Package Version \
              | paste - - | sed 's/^Package: //; s/\tVersion: / /' \
              >> "$SNAPCRAFT_PRIME/meta/pkg-manifest.txt"
      done
      sort -u -o "$SNAPCRAFT_PRIME/meta/pkg-manifest.txt" "$SNAPCRAFT_PRIME/meta/pkg-manifest.txt"
