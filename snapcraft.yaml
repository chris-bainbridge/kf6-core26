name: kf6-core26
base: core26
summary: KDE Frameworks 6
description: |
  Runtime content snap providing the KF6 and Qt6 runtime for the
  plasma-desktop-session snap.

  Built by staging runtime packages from the KDE Neon unstable/resolute
  apt suite (same version train the previous from-source SDK build
  produced: Qt 6.11.1 / KF6 6.30 / Plasma 6.7.5), plus xkb/locale data
  from the resolute archive so libxkbcommon matches the core26 base
  byte-for-byte (the noble-built store kf6-core24 mismatched it and
  SIGSEGV'd ksmserver -- see notes/library/kde.txt).

  Package set derived by mapping the file inventory of the last
  from-source build onto the Neon suite's Contents index; build-time-only
  content the SDK merge used to carry (~74k files of nodejs/ghc/llvm/
  cmake/header cruft) is intentionally gone.

grade: stable
confinement: strict
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# Neon's arm64 coverage in the unstable/resolute suite is incomplete
# (no kwin/plasma binaries), so this deb-repack branch is amd64-only.
# The desktop/26 from-source branch keeps arm64.

adopt-info: kf6-runtime

environment:
  LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/lib:$SNAP/usr/lib:$SNAP/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}
  PATH: $SNAP/usr/sbin:$SNAP/usr/bin:$SNAP/sbin:$SNAP/bin:$PATH

slots:
  kf6-core26-slot:
    content: kf6-core26-all
    interface: content
    read:
    - .
  kf6-core26:
    content: kf6-core26
    interface: content
    read:
    - .

package-repositories:
-   type: apt
    components:
    - main
    suites:
    - resolute
    key-id: 444DABCF3667D0283F894EDDE6D4736255751E5D
    key-server: keyserver.ubuntu.com
    url: http://origin.archive.neon.kde.org/unstable

parts:
  kf6-runtime:
    plugin: nil
    # Unpinned on purpose: floating tracks Neon latest so security fixes
    # arrive automatically; the image build snapshots whatever the suite
    # had at build time. A temporary `=` pin is the emergency brake if a
    # Neon rollout breaks this build. go-build-kde checks the resolved
    # Qt/KF6 versions against plasma-core26-desktop to catch skew.
    stage-packages:
      # KF6/Qt runtime content staged from the KDE Neon unstable/resolute suite
      - kdegames-card-data-kf6
      - kdsoap-ws-discovery-client
      - kf6-attica
      - kf6-baloo
      - kf6-bluez-qt
      - kf6-breeze-icon-theme
      - kf6-frameworkintegration
      - kf6-karchive
      - kf6-kauth
      - kf6-kbookmarks
      - kf6-kcalendarcore
      - kf6-kcmutils
